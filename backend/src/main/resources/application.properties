spring.application.name=TCG

spring.datasource.url=jdbc:postgresql://localhost:5432/tcg?characterEncoding=UTF-8&stringtype=unspecified
spring.datasource.username=tcg
spring.datasource.password=tcg
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.http.encoding.charset=UTF-8
spring.http.encoding=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.force-response=true

server.port=8080
